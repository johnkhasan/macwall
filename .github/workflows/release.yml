name: Release

# Push a tag like v1.1.0 to build AeroWall.dmg and publish it as a GitHub Release.
# "Run workflow" from the Actions tab builds a test DMG without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroWall-${{ steps.version.outputs.version }}
          path: dist/AeroWall.dmg

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/AeroWall.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/AeroWall.dmg \
              --title "AeroWall ${{ steps.version.outputs.version }}" \
              --generate-notes --latest
          fi
