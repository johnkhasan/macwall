name: AeroWall
options:
  bundleIdPrefix: com.aerowall
  deploymentTarget:
    macOS: "14.0"
targets:
  AeroWall:
    type: application
    platform: macOS
    sources: [AeroWall]
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: YES
    info:
      path: AeroWall/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleIdentifier: com.aerowall.AeroWall
        CFBundleName: AeroWall
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
